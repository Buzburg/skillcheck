[package]
name = "skillcheck"
version = "0.1.0"
edition = "2021"
authors = ["Buzburg AI <dev@buzburg.ai>"]
description = "Lighthouse and security auditor for AI agent skills and prompt manifests."
license = "MIT"
repository = "https://github.com/Buzburg/skillcheck"
keywords = ["ai-agents", "linter", "security", "skills", "audit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.11"
colored = "2.1"

[dev-dependencies]
tempfile = "3.17"
